service:
  name: bangpii-news-backend
  instance_types:
    - name: nano
  ports:
    - port: 4000
      protocol: http
  routes:
    - path: /
      port: 4000
  env:
    - key: NODE_ENV
      value: production
    - key: HOST
      value: 0.0.0.0
    - key: PORT
      value: "4000"
    - key: SOCKETIO_ENABLED
      value: "true"
    - key: FE_URL
      value: https://bang-pii-news.vercel.app/
    - key: CORS_ORIGINS
      value: http://localhost:3000,https://bang-pii-news.vercel.app/
  scalings:
    - min: 1
      max: 1
